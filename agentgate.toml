# AgentGate Configuration
# Generated by agentgate init

[server]
host = "0.0.0.0"
port = 8787
api_keys = ["default_key"]
request_timeout_secs = 600
cors = true

[defaults]
workdir = "."
max_concurrency_per_provider = 10
model_cache_ttl_secs = 300

# Provider configurations
[[provider]]
id = "opencode"
bin = "opencode"
models_cmd = ["models"]
chat_cmd = ["run", "--model", "{model}", "--thinking", "--format", "json", "{prompt}"]
strip_ansi = true
enabled = true
models = ["opencode/beam-free", "opencode/flint-40b-free", "opencode/deepseek-v4.1-flash-free", "opencode/beam", "opencode/codestral"]
transport = "stdio_shim"

[[provider]]
id = "gemini"
bin = "gemini"
models_cmd = ["list", "--format", "json"]
chat_cmd = ["generate", "--model", "{model}", "--prompt-stdin"]
strip_ansi = true
enabled = true
models = ["gemini-2.5-pro", "gemini-2.5-flash"]

[[provider]]
id = "ollama"
bin = "ollama"
ollama_mode = "cli"
models_cmd = ["list"]
chat_cmd = ["run", "{model}"]
strip_ansi = true
enabled = true
models = ["llama3", "deepseek-r1", "phi3"]

[reasoning]
enabled = true
format = "reasoning_content"
null_content = false
early_role_chunk = true

[bridge.isolation]
# mode = "selective" | "strict" | "off"
# selective: disable conflicting built-ins (read, write, bash/execute, glob, list, patch), allow grep, webfetch, todo*, task
# strict: disable all built-in tools
# off: no tool disabling
mode = "selective"
# Additional built-in tools to allow beyond the mode defaults
allowed_builtins = ["bash", "execute", "shell", "read", "write", "edit", "glob", "list", "patch", "cat"]
# Override: explicitly disable these built-in tools
disabled_builtins = []
# FIX-PROMPT-01: When true, client system prompt is forwarded via CLI --system flag (default false: strip)
preserve_client_system_prompt = false
# FIX-FREELIMIT-01: When true (default), skip verbose permission block in opencode.json
# to avoid triggering provider.free-limit on free models (beam-free etc.)
minimal_free_model = true
