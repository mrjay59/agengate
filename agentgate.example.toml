[server]
host = "127.0.0.1"
port = 8787
api_keys = []
request_timeout_secs = 600
cors = false

[defaults]
workdir = "."
max_concurrency_per_provider = 2
model_cache_ttl_secs = 900
# Fail fast: max seconds to wait for the first provider event on a streaming
# request before returning an error chunk (code = first_token_timeout).
first_token_timeout_secs = 120

# Reasoning / thinking streaming (see docs/reasoning.md).
# Every value below is optional; these are the defaults.
[reasoning]
enabled = true
# reasoning_content | reasoning | both | think_tags | none | passthrough
format = "reasoning_content"
# Send "content": null alongside reasoning deltas (OpenAI-compatible UIs).
null_content = true
# Emit the assistant role chunk before the CLI produces output (lower TTFB).
early_role_chunk = true
# Coalescing window: flush reasoning/text after N ms or N bytes.
flush_ms = 40
flush_bytes = 256
# Hard per-turn limits (RS8). Truncation emits a marker once.
max_chars_per_turn = 200000
max_blocks_per_turn = 64
# Fallback when the CLI/model exposes no reasoning: activity | none | induce.
fallback = "activity"
activity_via_reasoning = true
activity_args = false
activity_min_interval_ms = 1500
# Label language for synthesized activity: id | en.
activity_lang = "id"
activity_prefix = "⏳ "
# Marker for omitted thinking blocks: activity | none.
omitted_marker = "activity"
# Best-effort redaction of reasoning/activity before it reaches clients.
redact_patterns = [
  '(?i)api[_-]?key\s*[:=]\s*\S+',
  'sk-[A-Za-z0-9_-]{16,}',
]

[[provider]]
id = "opencode"
enabled = true

[[provider]]
id = "copilot"
enabled = true
models = ["gpt-4o", "claude-3-5-sonnet"]

[[provider]]
id = "gemini"
enabled = true
models = ["gemini-2.5-pro", "gemini-2.5-flash"]

# -----------------------------------------------------------------------------
# NVIDIA NIM (OpenAI-compatible HTTP provider)
# Verified mapping: https://docs.api.nvidia.com/nim/reference/llm-apis
# Requires NVIDIA_API_KEY (`nvapi-*`). Disabled by default: set the key and
# flip `enabled = true` to activate. No CLI process is spawned in this mode.
# -----------------------------------------------------------------------------
[[provider]]
id = "nvidia"
type = "http_openai_compatible"
mode = "http"
adapter = "openai_compatible_chat"
base_url = "https://integrate.api.nvidia.com/v1"
chat_completions_path = "/chat/completions"
models_path = "/models"
auth_type = "bearer"
api_key_env = "NVIDIA_API_KEY"
api_key_prefix = "nvapi-"
mapping_status = "verified"
enabled = false
bridge = false
default_model = "meta/llama-3.3-70b-instruct"
models = [
  "meta/llama-3.3-70b-instruct",
  "meta/llama-3.1-8b-instruct",
  "meta/llama-3.1-70b-instruct",
  "qwen/qwen3-next-80b-a3b-instruct",
  "deepseek-ai/deepseek-v4-flash",
]
timeout_secs = 120
max_retries = 2
retry_backoff_ms = [250, 1000]
forward_tools = true
# NIM ChatRequest has additionalProperties=false and does not declare
# tool_choice / response_format / seed; forwarding them can return 422.
forward_tool_choice = false
forward_response_format = false
forward_stream = true
stream_idle_timeout_secs = 120
verify_tls = true
quota_exhausted_statuses = [429]
