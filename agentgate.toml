# AgentGate Configuration
# Generated by agentgate init
# SECURITY NOTICE: This file controls network exposure. Read comments carefully.

[server]
# Bind address: "127.0.0.1" (localhost only, SAFE) or "0.0.0.0" (all interfaces, REQUIRES api_keys)
# DEFAULT: "127.0.0.1" — only accepts local connections.
# WARNING: If you change to "0.0.0.0", you MUST set api_keys below, otherwise
# the server will be open to the entire network with NO AUTHENTICATION.
host = "127.0.0.1"
port = 8787

# API keys for Bearer token authentication.
# DEFAULT: [] (empty) — authentication DISABLED.
# If empty AND host is "0.0.0.0" or "::", the server is PUBLICLY ACCESSIBLE.
# For production or any non-localhost bind, set at least one strong random key:
# api_keys = ["your-secure-random-key-here"]
api_keys = []
request_timeout_secs = 120

# Cross-Origin Resource Sharing (CORS).
# DEFAULT: false — blocks browser requests from other origins.
# Set to true ONLY if you have a specific frontend origin and understand the risks.
# When true, allows ALL origins (*), ALL methods, ALL headers — not suitable for production.
# For production, use a reverse proxy (nginx, Caddy) with explicit CORS policy instead.
cors = false

[defaults]
workdir = "."
max_concurrency_per_provider = 2
model_cache_ttl_secs = 900
first_token_timeout_secs = 120

# Provider configurations
[[provider]]
id = "opencode"
bin = "opencode"
keep_alive = "10m"
models_cmd = ["models"]
chat_cmd = ["run", "--model", "{model}", "--thinking", "--format", "json", "{prompt}"]
strip_ansi = true
enabled = true
models = ["opencode/beam-free", "opencode/flint-40b-free", "opencode/deepseek-v4.1-flash-free", "opencode/beam", "opencode/codestral"]
transport = "stdio_shim"

[[provider]]
id = "gemini"
bin = "gemini"
models_cmd = ["list", "--format", "json"]
chat_cmd = ["generate", "--model", "{model}", "--prompt-stdin"]
strip_ansi = true
enabled = true
models = ["gemini-2.5-pro", "gemini-2.5-flash"]

[[provider]]
id = "ollama"
bin = "ollama"
ollama_mode = "cli"
ollama_stream_timeout = 300
models_cmd = ["list"]
chat_cmd = ["run", "{model}"]
strip_ansi = true
enabled = true
models = ["llama3", "deepseek-r1", "phi3"]

[reasoning]
enabled = true
format = "reasoning_content"
null_content = false
early_role_chunk = true

[bridge]
# FIX-QUOTA-03: Reduce concurrent runs for free tier to prevent quota exhaustion.
# These keys belong to [bridge]; under [bridge.limits] they were silently ignored.
max_runs_per_key = 1
max_parked_runs = 2
# FIX-QUOTA-STEP: lower from 50 to bound free-tier provider calls per tool loop.
max_steps = 25
call_ttl_secs = 120
park_ttl_secs = 120

[bridge.isolation]
# mode = "selective" | "strict" | "off"
# selective: disable conflicting built-ins (read, write, bash/execute, glob, list, patch), allow grep, webfetch, todo*, task
# strict: disable all built-in tools
# off: no tool disabling
mode = "selective"
# Additional built-in tools to allow beyond the mode defaults.
# FIX-TOOL-EXEC: do NOT allow opencode built-in `execute` here — it competes
# with the bridged MCP tool and emits a raw `execute` tool_call that AionUI
# cannot resolve ("unknown tool"). The bridged tool is canonicalized to `bash`
# and mapped back to the client-registered name (execCommand/execute).
allowed_builtins = []
# Override: explicitly disable these built-in tools
disabled_builtins = []
# FIX-FREELIMIT-01: When true (default), skip verbose permission block in opencode.json
# to avoid triggering provider.free-limit on free models (beam-free etc.)
minimal_free_model = false

# MCP tool-hold truncation (bridge.rs execute_tool path).
[bridge.limits]
max_inject = 10
max_tools = 128
max_prompt_chars = 64000
max_result_bytes = 262144

# Rendered-conversation limits actually used by the CLI/bridge provider.
# A replay re-sends the whole transcript, so this budget must stay small.
[limits]
max_inject = 10
max_tools = 128
max_prompt_chars = 64000
max_result_bytes = 262144

[routing]
no_tools_policy = "chat_only"
on_client_tools = "bridge"
default_workspace = "default"
# Model alias mapping handled in code defaults (service.rs resolve_model_alias)
# FIX-TEST-MODEL: 9router is an upstream aggregator, not a local provider, so
# map its model names to a locally registered free model for testing.
model_aliases = { "9router/free_forever" = "opencode/9router/free-forever", "agg/9router/free_forever" = "opencode/9router/free-forever", "free_forever" = "opencode/9router/free-forever" }

# =============================================================================
# SECURITY HARDENING GUIDE
# =============================================================================
# 1. DEFAULT CONFIG IS SAFE:
#    - host = "127.0.0.1" (localhost only)
#    - api_keys = [] (auth disabled, but only local access)
#    - cors = false (no cross-origin requests)
#
# 2. TO EXPOSE TO NETWORK (e.g., LAN, VPN, public IP):
#    a) Change host to "0.0.0.0" (IPv4) or "::" (IPv6)
#    b) SET api_keys = ["your-secure-random-key"] (at least one key)
#    c) Consider setting cors = false and using a reverse proxy for CORS
#    d) Enable TLS via reverse proxy (nginx/Caddy with Let's Encrypt)
#
# 3. API KEY GENERATION:
#    Use a cryptographically secure random string:
#    - openssl rand -hex 32
#    - or: python3 -c 'import secrets; print(secrets.token_urlsafe(32))'
#
# 4. CORS WARNING:
#    cors = true allows ANY website to make requests to your agentgate.
#    This enables CSRF and data exfiltration if api_keys are known/guessable.
#    Only enable if you have a specific trusted frontend origin.
#    For production, configure CORS at the reverse proxy level instead.
#
# 5. BRIDGE ENDPOINTS (/ _bridge/*):
#    These use per-session tokens, not api_keys. They are always accessible
#    if the session token is known. Ensure session tokens are not leaked.
#
# 6. PYTHON MCP ORPHAN WATCHDOG (environment variables):
#    Conservative cleanup for orphan Python MCP servers under `opencode serve --service`.
#    Set via environment variables (not in this file):
#    - AGENTGATE_MCP_ORPHAN_THRESHOLD_SECS: elapsed time threshold (default 3600s = 1h)
#    - AGENTGATE_MCP_ORPHAN_DRY_RUN: true=log only (default), false=kill orphans
#    Criteria for orphan:
#    1. Command line matches mcp-ssh-server.py or ssh-server/server.py
#    2. Parent process is `opencode serve --service`
#    3. Elapsed time > threshold
#    4. No active agentgate sessions
#    WARNING: Enable kill mode (dry_run=false) only after verifying logs.
# =============================================================================