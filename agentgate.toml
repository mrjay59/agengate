# AgentGate Configuration
# Generated by agentgate init

[server]
host = "0.0.0.0"
port = 8787
api_keys = ["default_key"]
request_timeout_secs = 600
cors = true

[defaults]
workdir = "."
max_concurrency_per_provider = 10
model_cache_ttl_secs = 300

# Provider configurations
[[provider]]
id = "opencode"
bin = "opencode"
models_cmd = ["models"]
chat_cmd = ["run", "--model", "{model}", "--thinking", "--format", "json", "{prompt}"]
strip_ansi = true
enabled = true

[[provider]]
id = "copilot"
bin = "gh"
models_cmd = ["api", "v1/copilot/models", "--jq", ".data[].name"]
chat_cmd = ["api", "v1/copilot/chat", "--method", "POST", "--input", "-"]
strip_ansi = true
enabled = true
models = ["gpt-4o", "claude-3-5-sonnet"]

[[provider]]
id = "gemini"
bin = "gemini"
models_cmd = ["list", "--format", "json"]
chat_cmd = ["generate", "--model", "{model}", "--prompt-stdin"]
strip_ansi = true
enabled = true
models = ["gemini-2.5-pro", "gemini-2.5-flash"]